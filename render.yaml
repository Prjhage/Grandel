services:
  # Backend Service
  - type: web
    name: grandel-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ATLASDB_URL
        sync: false
      - key: SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: grandel-frontend
          property: url

  # Frontend Service (Deployed as a Web Service to fix the issue)
  - type: web
    name: grandel-frontend
    root: frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -p $PORT
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: grandel-backend
          property: url
